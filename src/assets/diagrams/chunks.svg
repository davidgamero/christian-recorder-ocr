<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" role="img" aria-labelledby="title desc">
  <title id="title">03 — Divide columns into short image crops</title>
  <desc id="desc">A tall newspaper column is divided at line gaps into three smaller, source-linked chunks.</desc>
  <defs><pattern id="print" width="48" height="7" patternUnits="userSpaceOnUse"><path d="M4 3h38" stroke="#8b8170" stroke-width="1.2"/></pattern></defs>
  <rect x="29" y="15" width="55" height="125" fill="#fffdf6" stroke="#24211b" stroke-width="1.5"/>
  <rect x="33" y="19" width="47" height="117" fill="url(#print)"/>
  <path d="M23 56h67m-67 41h67" stroke="#7c3024" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M96 77h25m-6-5 6 5-6 5" fill="none" stroke="#24211b" stroke-width="2"/>
  <g fill="#fffdf6" stroke="#7c3024" stroke-width="1.5"><rect x="139" y="12" width="65" height="36"/><rect x="139" y="60" width="65" height="36"/><rect x="139" y="108" width="65" height="36"/></g>
  <g fill="url(#print)"><rect x="143" y="16" width="49" height="28"/><rect x="143" y="64" width="49" height="28"/><rect x="143" y="112" width="49" height="28"/></g>
  <g fill="#7c3024" font-family="monospace" font-size="10"><text x="212" y="34">1</text><text x="212" y="82">2</text><text x="212" y="130">3</text></g>
  <text x="56" y="154" font-family="Georgia,serif" font-size="11" text-anchor="middle" fill="#5d574b">one column</text>
</svg>
